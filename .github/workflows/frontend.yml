name: Build and Test Angular Frontend

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js (using Node 20 for compatibility)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Cache node_modules to speed up builds
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      # Step 4: Install dependencies
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend/pokedex-frontend

      # Step 5: Build the Angular app
      - name: Build Angular app
        run: npm run build --if-present
        working-directory: ./frontend/pokedex-frontend

      # Step 6: Run tests
      - name: Run tests
        run: npm run test --if-present -- --watch=false --browsers=ChromeHeadless
        working-directory: ./frontend/pokedex-frontend