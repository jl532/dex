name: Frontend CI with Docker

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Install Docker Compose
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      # Paths are case sensitive
      # Step 4: Build the Docker images
      - name: Build Docker images
        run: docker-compose build --no-cache
        working-directory: ./frontend/pokeDEX-frontend

      # Step 5: Build the Angular app inside the container
      - name: Build Angular app
        run: docker-compose run --rm angular-build
        working-directory: ./frontend/pokeDEX-frontend

      # Step 6: Verify dist directory
      - name: Verify dist directory
        run: ls -la dist/poke-dex-frontend
        working-directory: ./frontend/pokeDEX-frontend

      # Step 7: Run tests inside the container
      - name: Run tests
        run: docker-compose run --rm angular-test
        working-directory: ./frontend/pokeDEX-frontend